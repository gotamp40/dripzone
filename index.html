<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DRIPZONE Streetwear</title><meta name="description" content="DRIPZONE: streetwear para quem tem presença. R$50 a peça, R$40 a partir de 6 peças.">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mu:#6b6b6b;--ln:#e4e4e4;--cd:#f4f4f4}@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#f5f5f5;--mu:#999;--ln:#2a2a2a;--cd:#161616}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--fg);color:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 14px}header img{height:38px;border-radius:50%}header b{letter-spacing:.2em}.sp{flex:1}
header input{background:#8883;border:0;border-radius:8px;padding:8px 10px;min-width:0;width:100%;flex:1 1 100%;order:5;padding:11px 12px;color:inherit}@media(min-width:800px){header input{order:0;flex:none;width:240px;padding:8px 10px}}.ic{font-size:20px;padding:8px;position:relative}.ic i{position:absolute;top:0;right:0;background:var(--bg);color:var(--fg);border-radius:9px;font:700 11px/16px sans-serif;min-width:16px;text-align:center;font-style:normal}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--ln)}nav a{white-space:nowrap;padding:8px 14px;border:1px solid var(--ln);border-radius:20px;font-size:13px;font-weight:600}
main{max-width:1100px;margin:auto;padding:14px}h1,h2{text-transform:uppercase;letter-spacing:.03em;margin:22px 0 12px}
.hero{background:#0a0a0a;color:#fff;border-radius:14px;padding:44px 22px;text-align:center}.hero h1{font-size:clamp(28px,7vw,52px);margin:0 0 8px}.hero p{color:#bbb;margin:0 0 20px}
.btn{display:inline-block;background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:13px 20px;font-weight:700;cursor:pointer;min-height:46px;text-align:center}.hero .btn{background:#fff;color:#000}.btn.o{background:none;color:var(--fg);border:1px solid var(--fg)}.btn.w{background:#16a34a;color:#fff;width:100%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{background:var(--cd);border-radius:12px;overflow:hidden;position:relative}.im{aspect-ratio:3/4;background:var(--ln) center/cover;display:block}.card .t{padding:10px}small,.mu{color:var(--mu)}.fv{position:absolute;top:6px;right:6px;background:var(--bg);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer}
.tag{position:absolute;top:8px;left:8px;background:var(--fg);color:var(--bg);font:700 10px sans-serif;padding:3px 7px;border-radius:5px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tiles,.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}@media(min-width:800px){.tiles{grid-template-columns:repeat(4,1fr)}}.tiles a{background:var(--cd);border-radius:12px;padding:26px 8px;font-weight:700}.trust div{border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:13px}
.pg{display:grid;gap:18px}@media(min-width:800px){.pg{grid-template-columns:1fr 1fr}}.big{aspect-ratio:3/4;background:var(--cd) center/contain no-repeat;border-radius:12px}.th{display:flex;gap:6px;margin-top:8px;overflow-x:auto}.th span{width:60px;height:76px;background:var(--cd) center/cover;border-radius:8px;flex:none;border:2px solid transparent}.th .on{border-color:var(--fg)}
.sz{padding:10px 16px;border:1px solid var(--ln);background:none;border-radius:8px;cursor:pointer;font-weight:700}.sz.on{background:var(--fg);color:var(--bg)}.sz[disabled]{text-decoration:line-through;opacity:.4}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:11px;width:100%}label{display:block;font-size:13px;margin:10px 0 4px;color:var(--mu)}.bar{background:var(--cd);border-radius:10px;padding:12px;margin:10px 0;font-weight:600}
.ci{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.ci .im{width:64px;height:80px;aspect-ratio:auto;border-radius:8px;flex:none}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/3}
footer{background:var(--fg);color:var(--bg);padding:28px 14px;margin-top:30px;font-size:13px}footer a{margin-right:12px;display:inline-block;margin-bottom:6px}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs div{width:92px;text-align:center;font-size:11px}.thumbs span{display:block;aspect-ratio:3/4;background:var(--cd) center/cover;border-radius:8px}

return `<h1>Carrinho</h1><div class="pg"><div>${cart.map((c,i)=>{const p=P.find(x=>x.id==c.pid)||{name:'(indisponível)'};return `<div class="ci"><div class="im" ${p.id?mi(p):''}></div><div style="flex:1"><b>${p.name}</b><br><small>Tam. ${c.size} · ${R(s.u)}</small><div class="row"><button class="sz" onclick="cq(${i},-1)">−</button><b>${c.q}</b><button class="sz" onclick="cq(${i},1)">+</button><button class="sz" onclick="cart.splice(${i},1);saveC();route()">🗑</button></div></div></div>`}).join('')}<div class="bar">${msg()}<div class="pb"><i style="width:${Math.min(100,pieces()/st.bulk_min_qty*100)}%"></i></div></div><a class="btn o" href="#/produtos">Continuar comprando</a></div><div><div class="bar">Peças: ${s.n} · Faixa: ${R(s.u)}/peça<br>Subtotal: ${R(s.sub)}<br>Desconto por quantidade: −${R(s.d)}<br>Frete: ${s.fr?R(s.fr):'a combinar'}<br><span style="font-size:18px">Total: ${R(s.t)}</span></div><h2>Seus dados</h2><div class="f2">${[['nome','Nome','full'],['cpf','CPF'],['wpp','WhatsApp'],['mail','E-mail','full'],['cep','CEP'],['uf','Estado'],['cid','Cidade'],['bai','Bairro'],['rua','Rua','full'],['num','Número'],['comp','Complemento']].map(f=>`<div class="${f[2]||''}"><label>${f[1]}</label><input id="k_${f[0]}" value="${L('dz_u',{})[f[0]]||''}"></div>`).join('')}</div><br><button class="btn w" onclick="wa()">FINALIZAR PEDIDO PELO WHATSAPP</button><p class="mu" style="font-size:12px">Pagamento online (PIX/cartão) ainda não está ativo; o pedido segue pelo WhatsApp.</p></div></div>`}
function cq(i,d){const c=cart[i],p=P.find(x=>x.id==c.pid),v=p&&vs(p).find(x=>x.id==c.vid);if(d>0&&v&&c.q+1>v.stock)return alert('Estoque insuficiente');c.q+=d;if(c.q<1)cart.splice(i,1);saveC();track('qty_change',{});route()}
function wa(){const u={};document.querySelectorAll('[id^=k_]').forEach(e=>u[e.id.slice(2)]=e.value.trim());if(!u.nome||!u.wpp)return alert('Informe nome e WhatsApp');S('dz_u',u);const s=sums();
const t=`*Pedido DRIPZONE*\nNome: ${u.nome}\nCPF: ${u.cpf}\nWhatsApp: ${u.wpp}\nEndereço: ${u.rua}, ${u.num} ${u.comp} - ${u.bai}, ${u.cid}/${u.uf} CEP ${u.cep}\n\n`+cart.map(c=>{const p=P.find(x=>x.id==c.pid)||{};return `• ${p.name} (${p.code||''}) tam. ${c.size} x${c.q} = ${R(c.q*s.u)}`}).join('\n')+`\n\nPeças: ${s.n}\nFaixa: ${R(s.u)}/peça\nSubtotal: ${R(s.sub)}\nDesconto: −${R(s.d)}\nFrete: ${s.fr?R(s.fr):'a combinar'}\n*Total: ${R(s.t)}*`;track('whatsapp_click',{});open('https://wa.me/'+st.whatsapp+'?text='+encodeURIComponent(t),'_blank')}
/* ===== ADMIN ===== */
function admin(){if(!adm)return `<h1>Painel</h1><label>E-mail</label><input id="em" type="email"><label>Senha</label><input id="ps" type="password"><br><br><button class="btn" onclick="login()">Entrar</button>`;
return `<h1>Admin</h1><div class="row"><a class="btn" href="#/admin/novo">+ Adicionar produto</a><button class="btn o" onclick="sb.auth.signOut().then(()=>location.reload())">Sair</button></div><h2>Produtos (${P.length})</h2>${P.map(p=>`<div class="ci"><div class="im" ${mi(p)}></div><div style="flex:1"><b>${p.name}</b><br><small>${p.code||''} · estoque ${tot(p)} · ${p.active?'ativo':'inativo'}</small></div><a class="sz" href="#/admin/e/${p.id}">Editar</a><button class="sz" onclick="delp('${p.id}')">🗑</button></div>`).join('')}<h2>Configurações e regra de preço</h2><div class="f2">${[['price_normal','Preço normal (R$)'],['price_bulk','Preço na quantidade (R$)'],['bulk_min_qty','Peças p/ preço menor'],['flat_shipping','Frete fixo (R$)'],['whatsapp','WhatsApp (55+DDD)']].map(f=>`<div><label>${f[1]}</label><input id="s_${f[0]}" value="${st[f[0]]}"></div>`).join('')}</div><br><button class="btn" onclick="savs()">Salvar configurações</button>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#ps').value});if(!er(error))load()}
async function savs(){const o={};['price_normal','price_bulk','bulk_min_qty','flat_shipping'].forEach(k=>o[k]=+$('#s_'+k).value);o.whatsapp=$('#s_whatsapp').value.trim();if(er((await sb.from('store_settings').update(o).eq('id',1)).error))return;alert('Salvo');load()}
async function delp(id){if(!confirm('Excluir produto e fotos?'))return;const p=P.find(x=>x.id==id);await sb.storage.from('product-images').remove(imgs(p).map(i=>i.storage_path));if(!er((await sb.from('products').delete().eq('id',id)).error))load()}
function form(id){if(!adm)return admin();if(!draft){const p=id&&P.find(x=>x.id==id);draft=p?{...p,stock:Object.fromEntries(vs(p).map(v=>[v.size,v.stock])),sizes:vs(p).map(v=>v.size),isNew:false}:{id:crypto.randomUUID(),name:'',category_id:CAT[0]?.id,code:'',description:'',sizes:['M','G','GG'],stock:{},is_new:false,is_featured:false,is_offer:false,active:true,isNew:true};files=[]}const d=draft,ex=P.find(x=>x.id==d.id),g=ex?imgs(ex):[];
return `<h1>${d.isNew?'Adicionar':'Editar'} produto</h1><label>Nome</label><input id="d_name" value="${d.name}"><label>Categoria</label><select id="d_cat">${CAT.map(c=>`<option value="${c.id}" ${c.id==d.category_id?'selected':''}>${c.name}</option>`).join('')}</select><label>Código</label><input id="d_code" value="${d.code||''}"><label>Descrição</label><textarea id="d_desc" rows="3">${d.description||''}</textarea>
<label>Fotos (a primeira é a principal)</label><input type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="pick(this.files)"><div class="thumbs" style="margin-top:8px">${g.map((x,i)=>`<div><span style="background-image:url(${iu(x.storage_path)})"></span>${i?`<a onclick="mp('${x.id}')"><u>tornar principal</u></a><br>`:'<b>Principal</b><br>'}${i?`<a class="sz" onclick="mvi(${i},-1)">←</a>`:''}${i<g.length-1?`<a class="sz" onclick="mvi(${i},1)">→</a>`:''} <a onclick="di('${x.id}','${x.storage_path}')">🗑</a></div>`).join('')}${files.map((f,i)=>`<div><span style="background-image:url(${f.u})"></span>nova <a onclick="files.splice(${i},1);route()">🗑</a></div>`).join('')}</div>
<label>Tamanhos e estoque</label><div class="row">${SZ.map(s=>`<label style="margin:0"><input type="checkbox" ${d.sizes.includes(s)?'checked':''} onchange="ts('${s}',this.checked)"> ${s}</label>${d.sizes.includes(s)?`<input style="width:70px" type="number" min="0" placeholder="qtd" value="${d.stock[s]||''}" oninput="draft.stock['${s}']=+this.value">`:''}`).join('')}</div><div class="row" style="margin-top:12px">${[['is_new','Lançamento'],['is_featured','Destaque'],['is_offer','Oferta'],['active','Ativo']].map(f=>`<label style="margin:0"><input type="checkbox" ${d[f[0]]?'checked':''} onchange="draft.${f[0]}=this.checked"> ${f[1]}</label>`).join('')}</div><br><button class="btn" id="sv" onclick="sv()">SALVAR PRODUTO</button>`}
function rd(){const g=k=>$('#d_'+k);if(!g('name'))return;draft.name=g('name').value;draft.category_id=g('cat').value;draft.code=g('code').value;draft.description=g('desc').value}
const toWebp=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b),'image/webp',.85)};i.src=URL.createObjectURL(f)});
function pick(fl){rd();[...fl].forEach(f=>files.push({f,u:URL.createObjectURL(f)}));route()}
function ts(s,c){rd();draft.sizes=c?[...draft.sizes,s]:draft.sizes.filter(x=>x!=s);route()}
async function setOrder(ids){await Promise.all(ids.map((id,position)=>sb.from('product_images').update({position}).eq('id',id)));await load()}
async function mp(id){rd();const g=imgs(P.find(x=>x.id==draft.id)).map(i=>i.id);await setOrder([id,...g.filter(x=>x!=id)])}
async function mvi(i,d){rd();const g=imgs(P.find(x=>x.id==draft.id)).map(i=>i.id);[g[i],g[i+d]]=[g[i+d],g[i]];await setOrder(g)}
async function di(id,path){rd();await sb.storage.from('product-images').remove([path]);await sb.from('product_images').delete().eq('id',id);await load()}
async function sv(){rd();const d=draft;if(!d.name)return alert('Informe o nome');$('#sv').disabled=true;$('#sv').textContent='Salvando…';
const slug=(d.slug)||(d.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+d.id.slice(0,4));
const row={id:d.id,slug,name:d.name,code:d.code||null,description:d.description,category_id:d.category_id,is_new:d.is_new,is_featured:d.is_featured,is_offer:d.is_offer,active:d.active};
if(er((await sb.from('products').upsert(row)).error)){$('#sv').disabled=false;return}
const vr=d.sizes.map(s=>({product_id:d.id,size:s,color:'',stock:+d.stock[s]||0}));if(vr.length&&er((await sb.from('product_variants').upsert(vr,{onConflict:'product_id,size,color'})).error))return;
const rm=SZ.filter(s=>!d.sizes.includes(s));if(rm.length)await sb.from('product_variants').delete().eq('product_id',d.id).in('size',rm);
const ex=P.find(x=>x.id==d.id);let pos=ex?imgs(ex).length:0;for(const x of files){const path=d.id+'/'+crypto.randomUUID()+'.webp',{error}=await sb.storage.from('product-images').upload(path,await toWebp(x.f),{contentType:'image/webp'});if(er(error))break;await sb.from('product_images').insert({product_id:d.id,storage_path:path,position:pos++})}
draft=null;files=[];await load();location.hash='#/admin'}
const wf=()=>(st.whatsapp||'').replace(/^55(\d\d)(\d{5})(\d{4})$/,'($1) $2-$3'),wl=()=>`<a href="https://wa.me/${st.whatsapp}" target="_blank"><u>${wf()}</u></a>`,ig='<a href="https://instagram.com/dripzone.atacado" target="_blank"><u>@dripzone.atacado</u></a>',upd='<p class="mu">Atualizado em outubro de 2026.</p>';
const INFO={
privacidade:['Política de privacidade',()=>`<p>Esta política explica como a DRIPZONE trata seus dados pessoais, em conformidade com a Lei Geral de Proteção de Dados (LGPD, Lei 13.709/2018).</p><h2>Dados que coletamos</h2><p>Nome, CPF, WhatsApp, e-mail e endereço de entrega, informados por você ao fazer um pedido ou criar uma conta. Também usamos o armazenamento do seu navegador para guardar o carrinho e os favoritos.</p><h2>Para que usamos</h2><p>Para processar e entregar seu pedido, falar com você sobre ele, emitir documentos fiscais quando aplicável e cumprir obrigações legais.</p><h2>Compartilhamento</h2><p>Compartilhamos os dados apenas com quem é necessário para concluir o pedido: transportadoras, meios de pagamento e serviços de hospedagem e banco de dados da loja. Não vendemos seus dados.</p><h2>Seus direitos</h2><p>Você pode pedir acesso, correção, exclusão dos seus dados e informações sobre o tratamento, a qualquer momento, pelo WhatsApp ${wl()} ou pelo Instagram ${ig}.</p><h2>Segurança e retenção</h2><p>Adotamos medidas para proteger seus dados e os guardamos pelo tempo necessário para o pedido e para obrigações legais.</p><h2>Cookies e métricas</h2><p>Quando ativarmos ferramentas de análise e anúncios (como Google Analytics e Meta Pixel), elas poderão coletar dados de navegação de forma agregada.</p>${upd}`],
termos:['Termos de uso',()=>`<h2>Uso do site</h2><p>Ao usar o site da DRIPZONE você concorda com estes termos. Use-o apenas para consultar produtos e fazer pedidos de forma legítima.</p><h2>Preços e regra de quantidade</h2><p>De 1 a ${st.bulk_min_qty-1} peças, cada peça custa ${R(st.price_normal)}. A partir de ${st.bulk_min_qty} peças, cada peça custa ${R(st.price_bulk)}. A quantidade é o total de peças do carrinho, somando produtos, modelos e tamanhos diferentes. Os valores podem ser alterados, e o preço válido é o exibido no carrinho no momento do pedido.</p><h2>Estoque e disponibilidade</h2><p>Os produtos estão sujeitos ao estoque. Em caso de falta de uma peça após o pedido, entraremos em contato para oferecer troca, ajuste ou reembolso.</p><h2>Pedidos, pagamento e entrega</h2><p>O pedido é confirmado pelo atendimento no WhatsApp. Prazo e valor de frete são informados antes do fechamento.</p><h2>Imagens</h2><p>As fotos são ilustrativas, e pode haver pequena variação de cor conforme a tela.</p><h2>Propriedade intelectual</h2><p>Nome, logotipo, textos e imagens da DRIPZONE não podem ser copiados ou usados sem autorização.</p><h2>Alterações e foro</h2><p>Podemos atualizar estes termos a qualquer momento. Fica eleito o foro do domicílio do consumidor, conforme o Código de Defesa do Consumidor.</p>${upd}`],
contato:['Contato',()=>`<p>Atendimento pelo WhatsApp e pelo Instagram.</p><p>WhatsApp: ${wl()}</p><p>Instagram: ${ig}</p><p><a class="btn" target="_blank" href="https://wa.me/${st.whatsapp}">Falar no WhatsApp</a></p>`],
sobre:['Sobre nós',()=>`<p>A DRIPZONE é uma marca de streetwear com visual forte e preços competitivos, para quem tem presença. Atendemos clientes finais, lojistas e revendedores, com camisetas, bermudas e kits.</p><p>Fale com a gente pelo WhatsApp ${wl()} ou pelo Instagram ${ig}.</p>`]};

function hdr(){$('#tb').textContent=`Leve ${st.bulk_min_qty} peças e pague ${R(st.price_bulk)} cada · Envio para todo o Brasil`;$('#wab').href='https://wa.me/'+st.whatsapp+'?text='+encodeURIComponent('Olá! Vim pelo site da DRIPZONE.');$('#cc').textContent=pieces();$('#fw').textContent=(st.whatsapp||'').replace(/^55(\d\d)(\d{5})(\d{4})$/,'($1) $2-$3');$('#nav').innerHTML='<a href="#/produtos">Todos</a>'+CAT.map(c=>`<a href="#/cat/${c.slug}">${c.name}</a>`).join('')+'<a href="#/cat/lancamentos">Lançamentos</a><a href="#/cat/ofertas">Ofertas</a>'}
function route(){if(!sb)return;const h=location.hash.replace(/^#/,'').split('?')[0]||'/',s=h.split('/');if(s[1]!='admin')draft=null;document.title='DRIPZONE Streetwear';let v;
if(h=='/')v=home();else if(h=='/produtos')v=list();else if(s[1]=='cat')v=list(s[2]);else if(s[1]=='p')v=prod(s[2]);else if(h=='/carrinho')v=cartV();else if(h=='/fav')v=`<h1>Favoritos</h1><div class="grid">${P.filter(p=>fav.includes(p.id)).map(card).join('')||'<p class="mu">Nenhum favorito.</p>'}</div>`;else if(h=='/admin')v=admin();else if(h=='/admin/novo')v=form();else if(s[1]=='admin'&&s[2]=='e')v=form(s[3]);else if(s[1]=='info'&&INFO[s[2]])v=`<h1>${INFO[s[2]][0]}</h1><div class="doc">${INFO[s[2]][1]()}</div>`;else v=home();
$('#app').innerHTML=v;hdr()}
let last='';addEventListener('hashchange',()=>{const h=location.hash.split('?')[0];if(h!=last){sel=null;gi=0;qty=1;page=0;scrollTo(0,0)}last=h;route()});
$('#q').addEventListener('keydown',e=>{if(e.key=='Enter')location.hash='#/produtos?q='+encodeURIComponent(e.target.value)});
if(sb)load();
</script></body></html>
