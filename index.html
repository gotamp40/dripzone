function fl(k,v){const h=location.hash.split('?')[0],u=new URLSearchParams(location.hash.split('?')[1]||'');v?u.set(k,v):u.delete(k);location.hash=h+'?'+u}
function prod(slug){const p=P.find(x=>x.slug==slug);if(!p)return'<p>Produto não encontrado.</p>';document.title=p.name+' | DRIPZONE';track('view_item',{id:p.id});const g=imgs(p),b=g[gi]?iu(g[gi].storage_path):'';
return `<div class="pg"><div><div class="big" style="background-image:url(${b})"></div><div class="th">${g.map((x,i)=>`<span class="${i==gi?'on':''}" style="background-image:url(${iu(x.storage_path)})" onclick="gi=${i};route()"></span>`).join('')}</div></div><div><small>Cód. ${p.code||'-'}</small><h1 style="margin-top:4px">${p.name}</h1><div style="font-size:22px;font-weight:800">${R(unit(pieces()+qty))} <small>por peça</small></div><div class="bar">1 a ${st.bulk_min_qty-1} peças: ${R(st.price_normal)} · ${st.bulk_min_qty}+ peças: ${R(st.price_bulk)} (total do carrinho)</div><p>${(p.description||'').replace(/</g,'&lt;')}</p><label>Tamanho</label><div class="row">${vs(p).map(v=>`<button class="sz ${sel==v.id?'on':''}" ${v.stock<1?'disabled':''} onclick="sel='${v.id}';route()">${v.size}${v.stock<1?' · ESGOTADO':''}</button>`).join('')}</div><label>Quantidade</label><div class="row"><button class="sz" onclick="qty=Math.max(1,qty-1);route()">−</button><b>${qty}</b><button class="sz" onclick="qty++;route()">+</button></div><br><div class="row"><button class="btn" style="flex:1" onclick="add('${p.id}',0)">Adicionar ao carrinho</button><button class="btn o" style="flex:1" onclick="add('${p.id}',1)">Comprar agora</button></div><br><div class="row"><a class="btn o" target="_blank" href="https://wa.me/?text=${encodeURIComponent(p.name+' '+location.href)}">WhatsApp</a><button class="btn o" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href)">Copiar link</button><button class="btn o" onclick="tf('${p.id}')">${fav.includes(p.id)?'♥':'♡'}</button></div><p class="mu">Envio para todo o Brasil. Trocas conforme <a href="#/info/trocas"><u>política</u></a>.</p></div></div>${rowv('Relacionados',act().filter(x=>x.id!=p.id&&x.category_id==p.category_id))}`}
function add(pid,go){const p=P.find(x=>x.id==pid),v=vs(p).find(x=>x.id==sel);if(!v)return alert('Escolha um tamanho');const k=cart.find(c=>c.vid==v.id),have=(k?k.q:0)+qty;if(have>v.stock)return alert('Estoque insuficiente');k?k.q=have:cart.push({vid:v.id,pid,size:v.size,q:qty});saveC();track('add_to_cart',{id:pid});qty=1;go?location.hash='#/carrinho':(hdr(),alert(msg()))}
function msg(){const n=pieces(),m=st.bulk_min_qty;return n>=m?`Você atingiu ${m} peças! Agora suas peças estão por ${R(st.price_bulk)} cada.`:n?`Adicione mais ${m-n} peça(s) e pague ${R(st.price_bulk)} por peça.`:''}
function sums(){const n=pieces(),u=unit(n),sub=n*st.price_normal,t=n*u,fr=+st.flat_shipping||0;return{n,u,sub,d:sub-t,fr,t:t+fr}}
function cartV(){const s=sums();if(!cart.length)return '<h1>Carrinho</h1><p class="mu">Seu carrinho está vazio.</p><a class="btn" href="#/produtos">Continuar comprando</a>';
return `<h1>Carrinho</h1><div class="pg"><div>${cart.map((c,i)=>{const p=P.find(x=>x.id==c.pid)||{name:'(indisponível)'};return `<div class="ci"><div class="im" ${p.id?mi(p):''}></div><div style="flex:1"><b>${p.name}</b><br><small>Tam. ${c.size} · ${R(s.u)}</small><div class="row"><button class="sz" onclick="cq(${i},-1)">−</button><b>${c.q}</b><button class="sz" onclick="cq(${i},1)">+</button><button class="sz" onclick="cart.splice(${i},1);saveC();route()">🗑</button></div></div></div>`}).join('')}<div class="bar">${msg()}</div><a class="btn o" href="#/produtos">Continuar comprando</a></div><div><div class="bar">Peças: ${s.n} · Faixa: ${R(s.u)}/peça<br>Subtotal: ${R(s.sub)}<br>Desconto por quantidade: −${R(s.d)}<br>Frete: ${s.fr?R(s.fr):'a combinar'}<br><span style="font-size:18px">Total: ${R(s.t)}</span></div><h2>Seus dados</h2><div class="f2">${[['nome','Nome','full'],['cpf','CPF'],['wpp','WhatsApp'],['mail','E-mail','full'],['cep','CEP'],['uf','Estado'],['cid','Cidade'],['bai','Bairro'],['rua','Rua','full'],['num','Número'],['comp','Complemento']].map(f=>`<div class="${f[2]||''}"><label>${f[1]}</label><input id="k_${f[0]}" value="${L('dz_u',{})[f[0]]||''}"></div>`).join('')}</div><br><button class="btn w" onclick="wa()">FINALIZAR PEDIDO PELO WHATSAPP</button><p class="mu" style="font-size:12px">Pagamento online (PIX/cartão) ainda não está ativo; o pedido segue pelo WhatsApp.</p></div></div>`}
function cq(i,d){const c=cart[i],p=P.find(x=>x.id==c.pid),v=p&&vs(p).find(x=>x.id==c.vid);if(d>0&&v&&c.q+1>v.stock)return alert('Estoque insuficiente');c.q+=d;if(c.q<1)cart.splice(i,1);saveC();track('qty_change',{});route()}
function wa(){const u={};document.querySelectorAll('[id^=k_]').forEach(e=>u[e.id.slice(2)]=e.value.trim());if(!u.nome||!u.wpp)return alert('Informe nome e WhatsApp');S('dz_u',u);const s=sums();
const t=`*Pedido DRIPZONE*\nNome: ${u.nome}\nCPF: ${u.cpf}\nWhatsApp: ${u.wpp}\nEndereço: ${u.rua}, ${u.num} ${u.comp} - ${u.bai}, ${u.cid}/${u.uf} CEP ${u.cep}\n\n`+cart.map(c=>{const p=P.find(x=>x.id==c.pid)||{};return `• ${p.name} (${p.code||''}) tam. ${c.size} x${c.q} = ${R(c.q*s.u)}`}).join('\n')+`\n\nPeças: ${s.n}\nFaixa: ${R(s.u)}/peça\nSubtotal: ${R(s.sub)}\nDesconto: −${R(s.d)}\nFrete: ${s.fr?R(s.fr):'a combinar'}\n*Total: ${R(s.t)}*`;track('whatsapp_click',{});open('https://wa.me/'+st.whatsapp+'?text='+encodeURIComponent(t),'_blank')}
/* ===== ADMIN ===== */
function admin(){if(!adm)return `<h1>Painel</h1><label>E-mail</label><input id="em" type="email"><label>Senha</label><input id="ps" type="password"><br><br><button class="btn" onclick="login()">Entrar</button>`;
return `<h1>Admin</h1><div class="row"><a class="btn" href="#/admin/novo">+ Adicionar produto</a><button class="btn o" onclick="sb.auth.signOut().then(()=>location.reload())">Sair</button></div><h2>Produtos (${P.length})</h2>${P.map(p=>`<div class="ci"><div class="im" ${mi(p)}></div><div style="flex:1"><b>${p.name}</b><br><small>${p.code||''} · estoque ${tot(p)} · ${p.active?'ativo':'inativo'}</small></div><a class="sz" href="#/admin/e/${p.id}">Editar</a><button class="sz" onclick="delp('${p.id}')">🗑</button></div>`).join('')}<h2>Configurações e regra de preço</h2><div class="f2">${[['price_normal','Preço normal (R$)'],['price_bulk','Preço na quantidade (R$)'],['bulk_min_qty','Peças p/ preço menor'],['flat_shipping','Frete fixo (R$)'],['whatsapp','WhatsApp (55+DDD)']].map(f=>`<div><label>${f[1]}</label><input id="s_${f[0]}" value="${st[f[0]]}"></div>`).join('')}</div><br><button class="btn" onclick="savs()">Salvar configurações</button>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#ps').value});if(!er(error))load()}
async function savs(){const o={};['price_normal','price_bulk','bulk_min_qty','flat_shipping'].forEach(k=>o[k]=+$('#s_'+k).value);o.whatsapp=$('#s_whatsapp').value.trim();if(er((await sb.from('store_settings').update(o).eq('id',1)).error))return;alert('Salvo');load()}
async function delp(id){if(!confirm('Excluir produto e fotos?'))return;const p=P.find(x=>x.id==id);await sb.storage.from('product-images').remove(imgs(p).map(i=>i.storage_path));if(!er((await sb.from('products').delete().eq('id',id)).error))load()}
function form(id){if(!adm)return admin();if(!draft){const p=id&&P.find(x=>x.id==id);draft=p?{...p,stock:Object.fromEntries(vs(p).map(v=>[v.size,v.stock])),sizes:vs(p).map(v=>v.size),isNew:false}:{id:crypto.randomUUID(),name:'',category_id:CAT[0]?.id,code:'',description:'',sizes:['M','G','GG'],stock:{},is_new:false,is_featured:false,is_offer:false,active:true,isNew:true};files=[]}const d=draft,ex=P.find(x=>x.id==d.id),g=ex?imgs(ex):[];
return `<h1>${d.isNew?'Adicionar':'Editar'} produto</h1><label>Nome</label><input id="d_name" value="${d.name}"><label>Categoria</label><select id="d_cat">${CAT.map(c=>`<option value="${c.id}" ${c.id==d.category_id?'selected':''}>${c.name}</option>`).join('')}</select><label>Código</label><input id="d_code" value="${d.code||''}"><label>Descrição</label><textarea id="d_desc" rows="3">${d.description||''}</textarea>
<label>Fotos (a primeira é a principal)</label><input type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="pick(this.files)"><div class="thumbs" style="margin-top:8px">${g.map((x,i)=>`<div><span style="background-image:url(${iu(x.storage_path)})"></span>${i?`<a onclick="mp('${x.id}')"><u>tornar principal</u></a><br>`:'<b>Principal</b><br>'}${i?`<a class="sz" onclick="mvi(${i},-1)">←</a>`:''}${i<g.length-1?`<a class="sz" onclick="mvi(${i},1)">→</a>`:''} <a onclick="di('${x.id}','${x.storage_path}')">🗑</a></div>`).join('')}${files.map((f,i)=>`<div><span style="background-image:url(${f.u})"></span>nova <a onclick="files.splice(${i},1);route()">🗑</a></div>`).join('')}</div>
<label>Tamanhos e estoque</label><div class="row">${SZ.map(s=>`<label style="margin:0"><input type="checkbox" ${d.sizes.includes(s)?'checked':''} onchange="ts('${s}',this.checked)"> ${s}</label>${d.sizes.includes(s)?`<input style="width:70px" type="number" min="0" placeholder="qtd" value="${d.stock[s]||''}" oninput="draft.stock['${s}']=+this.value">`:''}`).join('')}</div><div class="row" style="margin-top:12px">${[['is_new','Lançamento'],['is_featured','Destaque'],['is_offer','Oferta'],['active','Ativo']].map(f=>`<label style="margin:0"><input type="checkbox" ${d[f[0]]?'checked':''} onchange="draft.${f[0]}=this.checked"> ${f[1]}</label>`).join('')}</div><br><button class="btn" id="sv" onclick="sv()">SALVAR PRODUTO</button>`}
function rd(){const g=k=>$('#d_'+k);if(!g('name'))return;draft.name=g('name').value;draft.category_id=g('cat').value;draft.code=g('code').value;draft.description=g('desc').value}
const toWebp=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b),'image/webp',.85)};i.src=URL.createObjectURL(f)});
function pick(fl){rd();[...fl].forEach(f=>files.push({f,u:URL.createObjectURL(f)}));route()}
function ts(s,c){rd();draft.sizes=c?[...draft.sizes,s]:draft.sizes.filter(x=>x!=s);route()}
async function setOrder(ids){await Promise.all(ids.map((id,position)=>sb.from('product_images').update({position}).eq('id',id)));await load()}
async function mp(id){rd();const g=imgs(P.find(x=>x.id==draft.id)).map(i=>i.id);await setOrder([id,...g.filter(x=>x!=id)])}
async function mvi(i,d){rd();const g=imgs(P.find(x=>x.id==draft.id)).map(i=>i.id);[g[i],g[i+d]]=[g[i+d],g[i]];await setOrder(g)}
async function di(id,path){rd();await sb.storage.from('product-images').remove([path]);await sb.from('product_images').delete().eq('id',id);await load()}
async function sv(){rd();const d=draft;if(!d.name)return alert('Informe o nome');$('#sv').disabled=true;$('#sv').textContent='Salvando…';
const slug=(d.slug)||(d.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+d.id.slice(0,4));
const row={id:d.id,slug,name:d.name,code:d.code||null,description:d.description,category_id:d.category_id,is_new:d.is_new,is_featured:d.is_featured,is_offer:d.is_offer,active:d.active};
if(er((await sb.from('products').upsert(row)).error)){$('#sv').disabled=false;return}
const vr=d.sizes.map(s=>({product_id:d.id,size:s,color:'',stock:+d.stock[s]||0}));if(vr.length&&er((await sb.from('product_variants').upsert(vr,{onConflict:'product_id,size,color'})).error))return;
const rm=SZ.filter(s=>!d.sizes.includes(s));if(rm.length)await sb.from('product_variants').delete().eq('product_id',d.id).in('size',rm);
const ex=P.find(x=>x.id==d.id);let pos=ex?imgs(ex).length:0;for(const x of files){const path=d.id+'/'+crypto.randomUUID()+'.webp',{error}=await sb.storage.from('product-images').upload(path,await toWebp(x.f),{contentType:'image/webp'});if(er(error))break;await sb.from('product_images').insert({product_id:d.id,storage_path:path,position:pos++})}
draft=null;files=[];await load();location.hash='#/admin'}
const INFO={trocas:['Trocas e devoluções','Texto a definir pela loja.'],privacidade:['Política de privacidade','Texto a definir pela loja (LGPD).'],termos:['Termos de uso','Texto a definir pela loja.']};
function hdr(){$('#cc').textContent=pieces();$('#fw').textContent=(st.whatsapp||'').replace(/^55(\d\d)(\d{5})(\d{4})$/,'($1) $2-$3');$('#nav').innerHTML='<a href="#/produtos">Todos</a>'+CAT.map(c=>`<a href="#/cat/${c.slug}">${c.name}</a>`).join('')+'<a href="#/cat/lancamentos">Lançamentos</a><a href="#/cat/ofertas">Ofertas</a>'}
function route(){if(!sb)return;const h=location.hash.replace(/^#/,'').split('?')[0]||'/',s=h.split('/');if(s[1]!='admin')draft=null;document.title='DRIPZONE Streetwear';let v;
if(h=='/')v=home();else if(h=='/produtos')v=list();else if(s[1]=='cat')v=list(s[2]);else if(s[1]=='p')v=prod(s[2]);else if(h=='/carrinho')v=cartV();else if(h=='/fav')v=`<h1>Favoritos</h1><div class="grid">${P.filter(p=>fav.includes(p.id)).map(card).join('')||'<p class="mu">Nenhum favorito.</p>'}</div>`;else if(h=='/admin')v=admin();else if(h=='/admin/novo')v=form();else if(s[1]=='admin'&&s[2]=='e')v=form(s[3]);else if(s[1]=='info'&&INFO[s[2]])v=`<h1>${INFO[s[2]][0]}</h1><p>${INFO[s[2]][1]}</p>`;else v=home();
$('#app').innerHTML=v;hdr()}
let last='';addEventListener('hashchange',()=>{const h=location.hash.split('?')[0];if(h!=last){sel=null;gi=0;qty=1;page=0;scrollTo(0,0)}last=h;route()});
$('#q').addEventListener('keydown',e=>{if(e.key=='Enter')location.hash='#/produtos?q='+encodeURIComponent(e.target.value)});
if(sb)load();
</script></body></html>
